name: Build NullWire

on:
  workflow_dispatch:
  push:
    branches: [main, 'copilot/**']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Build APK
        working-directory: receiver
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NullWire-Android-apk
          path: receiver/app/build/outputs/apk/debug/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Build sender
        shell: msys2 {0}
        working-directory: sender
        run: |
          g++ -std=c++20 -O2 -mwindows -static main.cpp -o NullWireSender.exe \
            -Wno-macro-redefined -lgdiplus -lavrt -lwinmm -lksuser -lpropsys -lole32 -lws2_32 -lgdi32 -lcomctl32 -lshell32 -ldwmapi -lmsimg32 -ladvapi32
      - uses: actions/upload-artifact@v4
        with:
          name: NullWire-Windows-exe
          path: sender/NullWireSender.exe
